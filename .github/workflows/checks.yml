name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install NumPy for the generated movie
        run: python -m pip install numpy
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            brew install ffmpeg
          fi
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            Add-Content $env:GITHUB_PATH "$env:ChocolateyInstall\bin"
          }
      - name: Check movie tools are available
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run synthetic reader tests
        run: python -m unittest
      - name: Run historical cave geometry tests
        run: python -m unittest discover -s tools/history/draracle
      - name: Check published suite counts
        run: python tools/suite_counts.py --check
      - name: Check the documentation index
        run: python tools/doc_index.py --check
      - name: Check the page-facts review inventory
        run: python tools/page_facts.py --check
      - name: Check repository contents
        run: python tools/repo_guard.py --check
