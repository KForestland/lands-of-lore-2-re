name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run synthetic reader tests
        run: python3 -m unittest
      - name: Run historical cave geometry tests
        run: python3 -m unittest discover -s tools/history/draracle
      - name: Check repository contents
        run: python3 tools/repo_guard.py --check
